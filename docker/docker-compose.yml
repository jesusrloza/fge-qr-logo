name: dgtipe

services:
  fge-qr-logo:
    container_name: fge-qr-logo
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Set VITE_BASE_URL for subpath deployments (e.g., /fge-qr-logo/)
        - VITE_BASE_URL=${VITE_BASE_URL:-/}
    ports:
      - '4173:4173'
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist URL cache across container restarts
      - cache-data:/app/data
      # Persist logs for auditing (quarterly files, 1-year retention)
      - log-data:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  cache-data:
    name: fge-qr-logo-cache
  log-data:
    name: fge-qr-logo-logs
